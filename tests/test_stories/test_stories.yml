# Test stories for `rasa test core`.
# CORRECTED after a real authoring bug found in Task 5 testing: every user
# turn while a form is active needs an explicit `action: trip_planning_form`
# step before `action_listen`, even though training stories in
# data/stories.yml can use the compact active_loop shorthand without it.
# Omitting this in the first version caused every story to diverge onto
# an unseen tracker state after the first form turn, triggering
# RulePolicy's core_fallback_threshold and masking otherwise-correct model
# behavior (see docs/testing-log.md for the full diagnosis).

version: "3.1"

stories:

- story: test Scenario 1 - low carbon preference reaches recommendation
  steps:
  - user: |
      hello
    intent: greet
  - action: utter_greet
  - user: |
      I want to plan a trip
    intent: plan_trip
  - action: trip_planning_form
  - active_loop: trip_planning_form
  - user: |
      London
    intent: inform
    entities:
    - origin: London
  - action: trip_planning_form
  - action: action_listen
  - user: |
      Paris
    intent: inform
    entities:
    - destination: Paris
  - action: trip_planning_form
  - action: action_listen
  - user: |
      I'm flexible
    intent: inform
    entities:
    - travel_date: flexible
  - action: trip_planning_form
  - action: action_listen
  - user: |
      2
    intent: inform
    entities:
    - num_travellers: "2"
  - action: trip_planning_form
  - action: action_listen
  - user: |
      mid
    intent: inform
    entities:
    - budget: mid
  - action: trip_planning_form
  - action: action_listen
  - user: |
      lowest carbon
    intent: inform
    entities:
    - sustainability_pref: low_carbon
  - action: trip_planning_form
  - active_loop: null
  - action: action_estimate_carbon
  - action: action_recommend_plan
  - action: utter_carbon_disclaimer

