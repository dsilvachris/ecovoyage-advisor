      xkjwoeiur random gibberish
    intent: nlu_fallback
  - action: action_scoped_fallback
  - action: trip_planning_form
  - action: action_listen
  - user: |
      I want a human advisor
    intent: request_human
  - action: action_handover
  - active_loop: null