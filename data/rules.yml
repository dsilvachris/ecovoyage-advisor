# Rules for EcoVoyage Advisor.
# Rasa 3.6.x, used alongside RulePolicy (config.yml).
#
# Design note: form ACTIVATION and SUBMISSION are both rules (deterministic
# — plan_trip always opens the form regardless of context, and completing
# it always leads to action_estimate_carbon -> action_recommend_plan ->
# utter_carbon_disclaimer, unconditionally). This used to be a story-only
# concern because red/green carbon branching once meant two different
# action sequences after the form — that's no longer true since
# action_recommend_plan folds the high-emission alert check into a plain
# Python conditional internally (see actions.py). Making submission a rule
# fixed a real bug found in live testing: completing a SECOND or THIRD trip
# in the same conversation (e.g. after using Reset) hit a tracker state
# TEDPolicy had never seen enough examples of, triggering RulePolicy's
# core_fallback_threshold safety net. A rule removes that guesswork
# entirely — it now works identically on trip #1, #2, or #50.
#
# utter_carbon_disclaimer was tried as a rule here and reverted: a rule with
# no condition is a strict global constraint (next action after
# action_recommend_plan MUST be utter_carbon_disclaimer, always), which
# directly contradicts any story ending at action_recommend_plan (implicit
# action_listen). Explicit placement in every story (stories.yml) is the
# correct fix instead.


version: "3.1"

rules:

- rule: Activate trip planning form
  steps:
  - intent: plan_trip
  - action: trip_planning_form
  - active_loop: trip_planning_form

- rule: Implementation of two-stage NLU fallback
  steps:
  - intent: nlu_fallback
  - action: action_scoped_fallback

- rule: Say hello anytime the user greets
  steps:
  - intent: greet
  - action: utter_greet

- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Respond to bot challenge anytime
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Handle out-of-scope requests anytime
  steps:
  - intent: out_of_scope
  - action: utter_out_of_scope

- rule: Reset the trip anytime it's requested
  steps:
  - intent: reset_trip
  - action: action_reset_trip
  - action: utter_trip_reset

- rule: Handle edit answer request anytime
  steps:
  - intent: edit_answer
  - action: action_edit_answer
  - action: trip_planning_form
  - active_loop: trip_planning_form

- rule: Continue filling the form whenever the user answers a question
  condition:
  - active_loop: trip_planning_form
  steps:
  - intent: inform
  - action: trip_planning_form

- rule: Complete trip planning form and generate a recommendation
  condition:
  - active_loop: trip_planning_form
  steps:
  - action: trip_planning_form
  - active_loop: null
  - action: action_estimate_carbon
  - action: action_recommend_plan
  - action: utter_carbon_disclaimer