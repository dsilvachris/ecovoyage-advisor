# nginx config — single entrypoint for EcoVoyage Advisor.
# STATUS: scaffold only, to be tested during Task 6.
#
# Routes:
#   /                        -> static chat frontend
#   /webhooks/...            -> Rasa REST server (internal :5005)
#   /admin                   -> static admin UI + admin API, Basic Auth required
#
# Port is intentionally kept as a build-arg-friendly value (see Dockerfile)
# rather than hardcoded in multiple places, so switching hosting platforms
# later (Render/Cloud Run/HF Spaces) only means changing one env var.

events {}

http {
  server {
    listen 7860;

    location / {
      root /app/frontend;
      try_files $uri $uri/ /index.html;
    }

    location /webhooks/ {
      proxy_pass http://127.0.0.1:5005/webhooks/;
      proxy_set_header Host $host;
    }

    location /admin {
      auth_basic "EcoVoyage Admin";
      auth_basic_user_file /etc/nginx/.htpasswd;

      location /admin/api/ {
        proxy_pass http://127.0.0.1:5056/admin/api/;  # admin_api.py process
        proxy_set_header Host $host;
      }

      root /app;
      try_files /admin/index.html =404;
    }
  }
}
