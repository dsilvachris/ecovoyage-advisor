        - title: "🇮🇪 Dublin"
          payload: '/inform{{"destination": "Dublin"}}'
        - title: "🇿🇦 Cape Town"
          payload: '/inform{{"destination": "Cape Town"}}'
        - title: "🇰🇪 Nairobi"
          payload: '/inform{{"destination": "Nairobi"}}'
        - title: "🇯🇵 Tokyo"
          payload: '/inform{{"destination": "Tokyo"}}'
        - title: "🇹🇭 Bangkok"
          payload: '/inform{{"destination": "Bangkok"}}'
        - title: "🇺🇸 New York"
          payload: '/inform{{"destination": "New York"}}'
        - title: "🇨🇦 Toronto"
          payload: '/inform{{"destination": "Toronto"}}'
        - title: "🇧🇷 Rio de Janeiro"
          payload: '/inform{{"destination": "Rio de Janeiro"}}'
        - title: "🇨🇴 Bogotá"
          payload: '/inform{{"destination": "Bogotá"}}'
        - title: "🇦🇺 Sydney"
          payload: '/inform{{"destination": "Sydney"}}'

  utter_ask_travel_date:
    - text: "When are you planning to travel? You can type dates, or choose a flexible plan."
      buttons:
        - title: "I'm flexible"
          payload: '/inform{{"travel_date": "flexible"}}'

  utter_ask_trip_duration_days:
    - text: "Great — how many days are you planning to travel for?"
      buttons:
        - title: "2 days"
          payload: '/inform{{"trip_duration_days": "2"}}'
        - title: "3 days"
          payload: '/inform{{"trip_duration_days": "3"}}'
        - title: "5 days"
          payload: '/inform{{"trip_duration_days": "5"}}'
        - title: "7 days"
          payload: '/inform{{"trip_duration_days": "7"}}'

  utter_ask_num_travellers:
    - text: "How many people are travelling? Pick a number, or type a phrase like \"me and my partner\"."
      buttons:
        - title: "Just me"
          payload: '/inform{{"num_travellers": "1"}}'
        - title: "2"
          payload: '/inform{{"num_travellers": "2"}}'
        - title: "3"
          payload: '/inform{{"num_travellers": "3"}}'
        - title: "4"
          payload: '/inform{{"num_travellers": "4"}}'

  utter_ask_budget:
    - text: "What's your rough daily budget per person?"
      buttons:
        - title: "Budget (up to €80/day)"
          payload: '/inform{{"budget": "budget"}}'
        - title: "Mid (€80-150/day)"
          payload: '/inform{{"budget": "mid"}}'
        - title: "Comfort (€150+/day)"
          payload: '/inform{{"budget": "comfort"}}'

  utter_ask_sustainability_pref:
    - text: "Last question: what matters most for this trip? This shapes how I rank your options."
      buttons:
        - title: "Lowest carbon"
          payload: '/inform{{"sustainability_pref": "low_carbon"}}'
        - title: "Eco-certified hotels"
          payload: '/inform{{"sustainability_pref": "eco_certified"}}'
        - title: "Local community support"
          payload: '/inform{{"sustainability_pref": "local_culture"}}'
        - title: "Balanced"
          payload: '/inform{{"sustainability_pref": "balanced"}}'

  utter_carbon_disclaimer:
    - text: "Note: carbon values are estimates based on average emission factors and curated data. Verify against an official source (e.g. DEFRA/ICAO) before relying on them."

  utter_out_of_scope:
    - text: "I can only help with planning a sustainable trip: destinations, transport, eco-hotels and your carbon footprint. Shall we carry on with that?"
      buttons:
        - title: "Continue planning"
          payload: "/plan_trip"

  utter_ask_rephrase:
    - text: "Sorry, I didn't quite catch that. I can help you plan a sustainable trip. Start below, or talk to a human advisor."
      buttons:
        - title: "Plan a trip"
          payload: "/plan_trip"
        - title: "Talk to a human"
          payload: "/request_human"

  utter_trip_reset:
    - text: "No problem, I've cleared your trip. Let's start fresh."
      buttons:
        - title: "Plan a trip"
          payload: "/plan_trip"

  utter_iamabot:
    - text: "I'm EcoVoyage Advisor, an automated assistant for sustainable trip planning. I can hand you over to a human advisor at any time."

  utter_goodbye:
    - text: "Safe and sustainable travels! Come back any time to plan your next trip."

  utter_default:
    - text: "I'm not sure I understood. I can help you plan a sustainable trip across our supported cities. Choose an option or type a city."
      buttons:
        - title: "Plan a trip"
          payload: "/plan_trip"
        - title: "Talk to a human"
          payload: "/request_human"

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true

