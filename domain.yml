# Domain for EcoVoyage Advisor.
# Rasa 3.6.x. Buttons showcase 6 of our 21 seeded cities spanning multiple
# continents (full list still reachable via free text) — keeps cognitive
# load low (NFR-01) while surfacing the global scope as a feature.

version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - bot_challenge
  - plan_trip
  - inform
  - request_recommendations
  - request_human
  - go_back
  - edit_answer
  - reset_trip
  - out_of_scope

entities:
  - origin
  - destination
  - travel_date
  - num_travellers
  - budget
  - sustainability_pref
  - field_to_edit
  - trip_duration_days
  - name
  - query

slots:
  # origin & destination use custom extraction so a city is only ever written
  # to the slot currently being requested (from_entity auto-fill ignores
  # requested_slot and would let one city overwrite the other — see
  # docs/api-integration-decision.md-style note in actions/actions.py once written).
  origin:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  destination:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  travel_date:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: travel_date
        not_intent: &control_intents
          - go_back
          - edit_answer
          - reset_trip
          - request_human
          - out_of_scope
          - affirm
          - deny
          - greet
          - goodbye
          - bot_challenge
          - plan_trip
          - request_recommendations
        conditions:
          - active_loop: trip_planning_form
            requested_slot: travel_date
      - type: from_text
        not_intent: *control_intents
        conditions:
          - active_loop: trip_planning_form
            requested_slot: travel_date

  num_travellers:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: num_travellers
        not_intent: *control_intents
        conditions:
          - active_loop: trip_planning_form
            requested_slot: num_travellers
      - type: from_text
        not_intent: *control_intents
        conditions:
          - active_loop: trip_planning_form
            requested_slot: num_travellers

  budget:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: budget
        not_intent: *control_intents
        conditions:
          - active_loop: trip_planning_form
            requested_slot: budget
      - type: from_text
        not_intent: *control_intents
        conditions:
          - active_loop: trip_planning_form
            requested_slot: budget

  sustainability_pref:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: sustainability_pref
        not_intent: *control_intents
        conditions:
          - active_loop: trip_planning_form
            requested_slot: sustainability_pref
      - type: from_text
        not_intent: *control_intents
        conditions:
          - active_loop: trip_planning_form
            requested_slot: sustainability_pref
  trip_duration_days:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        not_intent: *control_intents
        conditions:
          - active_loop: trip_planning_form
            requested_slot: trip_duration_days

  # --- Data slots, written by custom actions only ---
  estimated_co2:
    type: float
    influence_conversation: false
    mappings:
      - type: custom
  carbon_level:               # green / amber / red
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  data_source:                # climatiq / stored
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  recommended_mode:            # winning transport mode from action_estimate_carbon's scoring
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  recommended_distance_km:
    type: float
    influence_conversation: false
    mappings:
      - type: custom
  recommended_price_eur:
    type: float
    influence_conversation: false
    mappings:
      - type: custom
  
  transport_options_json:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

forms:
  trip_planning_form:
    required_slots:
      - origin
      - destination
      - travel_date
      - trip_duration_days
      - num_travellers
      - budget
      - sustainability_pref

actions:
  - validate_trip_planning_form
  - action_estimate_carbon
  - action_recommend_plan
  - action_clarify_destination
  - action_go_back                # FR-11
  - action_edit_answer            # FR-11
  - action_reset_trip             # FR-12
  - action_handover               # FR-08, FR-09: package full context for a human advisor
  - action_scoped_fallback        # FR-10: two-stage clarification -> escalation

responses:

  utter_greet:
    - text: "Hi! I'm EcoVoyage Advisor. I can help you plan a lower-carbon trip and estimate its footprint. Ready to start?"
      buttons:
        - title: "Plan a trip"
          payload: "/plan_trip"

  utter_ask_origin:
    - text: "Where are you travelling from? Tap a city, use your current location, or type any of our supported cities."
      buttons:
        - title: "🇩🇪 Berlin"
          payload: '/inform{{"origin": "Berlin"}}'
        - title: "🇫🇷 Paris"
          payload: '/inform{{"origin": "Paris"}}'
        - title: "🇬🇧 London"
          payload: '/inform{{"origin": "London"}}'
        - title: "🇳🇱 Amsterdam"
          payload: '/inform{{"origin": "Amsterdam"}}'
        - title: "🇩🇰 Copenhagen"
          payload: '/inform{{"origin": "Copenhagen"}}'
        - title: "🇪🇸 Madrid"
          payload: '/inform{{"origin": "Madrid"}}'
        - title: "🇮🇹 Rome"
          payload: '/inform{{"origin": "Rome"}}'
        - title: "🇪🇸 Barcelona"
          payload: '/inform{{"origin": "Barcelona"}}'
        - title: "🇦🇹 Vienna"
          payload: '/inform{{"origin": "Vienna"}}'
        - title: "🇨🇿 Prague"
          payload: '/inform{{"origin": "Prague"}}'
        - title: "🇵🇹 Lisbon"
          payload: '/inform{{"origin": "Lisbon"}}'
        - title: "🇮🇪 Dublin"
          payload: '/inform{{"origin": "Dublin"}}'
        - title: "🇿🇦 Cape Town"
          payload: '/inform{{"origin": "Cape Town"}}'
        - title: "🇰🇪 Nairobi"
          payload: '/inform{{"origin": "Nairobi"}}'
        - title: "🇯🇵 Tokyo"
          payload: '/inform{{"origin": "Tokyo"}}'
        - title: "🇹🇭 Bangkok"
          payload: '/inform{{"origin": "Bangkok"}}'
        - title: "🇺🇸 New York"
          payload: '/inform{{"origin": "New York"}}'
        - title: "🇨🇦 Toronto"
          payload: '/inform{{"origin": "Toronto"}}'
        - title: "🇧🇷 Rio de Janeiro"
          payload: '/inform{{"origin": "Rio de Janeiro"}}'
        - title: "🇨🇴 Bogotá"
          payload: '/inform{{"origin": "Bogotá"}}'
        - title: "🇦🇺 Sydney"
          payload: '/inform{{"origin": "Sydney"}}'

  utter_ask_destination:
    - text: "Which destination would you like to explore? Tap one or type any of our supported cities."
      buttons:
        - title: "🇩🇪 Berlin"
          payload: '/inform{{"destination": "Berlin"}}'
        - title: "🇫🇷 Paris"
          payload: '/inform{{"destination": "Paris"}}'
        - title: "🇬🇧 London"
          payload: '/inform{{"destination": "London"}}'
        - title: "🇳🇱 Amsterdam"
          payload: '/inform{{"destination": "Amsterdam"}}'
        - title: "🇩🇰 Copenhagen"
          payload: '/inform{{"destination": "Copenhagen"}}'
        - title: "🇪🇸 Madrid"
          payload: '/inform{{"destination": "Madrid"}}'
        - title: "🇮🇹 Rome"
          payload: '/inform{{"destination": "Rome"}}'
        - title: "🇪🇸 Barcelona"
          payload: '/inform{{"destination": "Barcelona"}}'
        - title: "🇦🇹 Vienna"
          payload: '/inform{{"destination": "Vienna"}}'
        - title: "🇨🇿 Prague"
          payload: '/inform{{"destination": "Prague"}}'
        - title: "🇵🇹 Lisbon"
